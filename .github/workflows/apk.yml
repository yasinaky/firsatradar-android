name: APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Proje paketini aç
        run: |
          if [ -f proje.b64 ]; then
            base64 -d proje.b64 | tar -xJf -
          fi
          ls -R app | head -40

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: APK derle
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK adını düzelt
        run: cp app/build/outputs/apk/release/app-release.apk FirsatRadar.apk

      - name: Release olarak yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: FırsatRadar ${{ github.run_number }}
          files: FirsatRadar.apk
          make_latest: true

      - uses: actions/upload-artifact@v4
        with:
          name: FirsatRadar-apk
          path: FirsatRadar.apk
